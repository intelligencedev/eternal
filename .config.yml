# OpenAI API Key
oai_key: '...'

# Anthropic Key for Claude Completions
anthropic_key: '...'

# Google API Key for Gemini Completions
google_key: '...'

# The desired user display name
current_user: 'User'

# Display name for LLM responses
assistant_name: 'Eternal'

# Host name and port of the frontend and management server
control_host: 'localhost'
control_port: 38765

# datapath will be created by Eternal to host persistent data
data_path: '/Users/$USER/.eternal'

# Service hosts for specific functionalities
service_hosts:
  # generate embeddings and local retrieval services
  retrieval:
    retrieval_host_1:
      host: 'localhost'
      port: 38765
  # image generation and processing
  image:
    image_host_1:
      host: 'localhost'
      port: 38765
  # text-to-speech and speech-to-text    
  speech:
    speech_host_1:
      host: 'localhost'
      port: 38765
  # llm text generation services
  llm:
    llm_host_1:
      host: 'localhost'
      port: '38765'
      gpu_layers: -1
    llm_host_2:
      host: 'localhost'
      port: '38765'
      gpu_layers: -1

default_project:
  name: "default"
  description: "This is the default project."
  team:
    name: "default_team"
    assistants:
      - name: "deepseek-coder-v2"
        role:
          name: "default"
        params:
          model: "deepseek-coder-v2"
      - name: "Codestral-22B-v0.1"
        role:
          name: "code_review"
        params:
          model: "Codestral-22B-v0.1"

tools:
  memory:
    enabled: false
    top_n: 3 # Number of similar chunks to retrieve from memory. Higher numbers require models with much higher context.
  webget:
    enabled: false
  websearch:
    enabled: false
    name: sxng # Only ddg and sxng available
    endpoint: ... # The url of the sxng instance if available. Not used if ddg is configured. Deploy your own or look in https://searx.space/
    top_n: 3 # Number of page results to retrieve. Higher numbers require models with much higher context.
  imggen:
    enabled: false
  team:
    enabled: false

# IMPORTANT #
# The defaults download Q8 versions of the GGUF models. Generally, you want to run the best version of each model that can fit in your GPU.
# If the defaults do not run on your system due to limited memory, change the model file from Q8_0 to Q4_0.
# We will implement more robust model selection and automatic version recommendations based on your system specs in the future.
language_models:
  - name: 'openai-gpt-4o'
    homepage: 'https://platform.openai.com/docs/models/gpt-4-and-gpt-4-turbo'
    prompt: '{system}\n\n{prompt}'
    ctx: 128000
    roles:
      - 'all'
  - name: 'anthropic-claude-3.5-sonnet'
    homepage: 'https://www.anthropic.com/product'
    prompt: |
      Below is an instruction that describes a task. Write a response that appropriately completes the request using advanced AI capabilities.

      ### Instruction:
      {system}
      {prompt}

      ### Response:
    ctx: 128000
    roles:
      - 'all'
  - name: 'google-gemini-1.5'
    homepage: 'https://deepmind.google/technologies/gemini/#gemini-1.5'
    prompt: '{prompt}'
    ctx: 2000000
    roles:
      - 'all'
