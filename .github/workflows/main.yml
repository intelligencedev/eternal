name: Go - Build and Test (CUDA)

on: workflow_dispatch

jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21.x'

    - name: Install CUDA Toolkit
      run: |
        # Install CUDA Toolkit (replace with your specific installation commands)
        sudo apt-get update
        sudo apt-get install -y cuda-toolkit-12-3

    - name: Install CMake
      run: sudo apt-get install -y cmake build-essential libtool autoconf unzip wget checkinstall zlib1g-dev libssl-dev

    - name: Set Build Environment
      run: |
        echo "GOOS=linux" >> $GITHUB_ENV
        echo "GOARCH=amd64" >> $GITHUB_ENV

    - name: Build with Makefile
      run: make all

    - name: Create Artifacts
      run: |
        mkdir -p artifacts
        cp eternal artifacts/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: artifacts
