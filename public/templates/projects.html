<!-- projects.html -->
<div id="projects-container" class="row">
  <div class="col">
    <!-- Projects Card -->
    <div class="card mx-2 mb-2" style="background-color: var(--et-card-bg);">
      <div class="card-header">
        <!-- Projects Header -->
        <span class="fs-6">Projects</span>
        <!-- Select Project -->
        <select class="form-select" id="project-select" onchange="selectProject()">
          <option value="">Select a project</option>
          <!-- Project options will be populated dynamically -->
        </select>
      </div>
      <div class="card-body tab-content mh-100">
        <button class="btn btn-primary bg-gradient mb-2" onclick="createNewProject()">Create New
          Project</button>
        <div id="selected-project-details"></div>
      </div>
    </div>

    <!-- Create Team Card -->
    <div class="card mx-2 mb-2" style="background-color: var(--et-card-bg);">
      <div class="card-header">
        <span class="fs-6">Create Team</span>
      </div>
      <div class="card-body tab-content mh-100">
        <form id="team-form">
          <div class="mb-3">
            <label for="team-name" class="form-label">Team Name</label>
            <input type="text" id="team-name" class="form-control" required>
          </div>
          <div id="team-members-container">
            <h6>Team Members</h6>
            <div class="team-member-entry mb-2">
              <div class="mb-2">
                <label for="member-name-1" class="form-label">Member Name</label>
                <input type="text" id="member-name-1" class="form-control member-name" required>
                <div class="mb-2">
                  <label for="member-role-1" class="form-label">Role</label>
                  <select id="member-role-1" class="form-select member-role" required>
                    <option value="">Select a role</option>
                  </select>
                </div>                
              </div>
            </div>
            <button type="button" class="btn btn-secondary bg-gradient mb-2" onclick="addTeamMember()">Add
              Team Member</button>
            <button type="submit" class="btn btn-primary bg-gradient">Create Team</button>
        </form>
      </div>
    </div>

    <!-- Create Project Card -->
    <div class="card mx-2 mb-2" style="background-color: var(--et-card-bg);">
      <div class="card-header">
        <span class="fs-6">Create Project</span>
      </div>
      <div class="card-body tab-content mh-100">
        <form id="project-form">
          <div class="mb-3">
            <label for="project-name" class="form-label">Project Name</label>
            <input type="text" id="project-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="project-description" class="form-label">Description</label>
            <textarea id="project-description" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label for="project-team" class="form-label">Assign Team</label>
            <select id="project-team" class="form-select" required>
              <option value="">Select a team</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary bg-gradient">Create Project</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Function to add a new team member entry
  function addTeamMember() {
    const teamMembersContainer = document.getElementById("team-members-container");
    const teamMemberEntry = document.querySelector(".team-member-entry");
    const newTeamMemberEntry = teamMemberEntry.cloneNode(true);

    // Clear the input fields
    newTeamMemberEntry.querySelector(".member-name").value = "";
    newTeamMemberEntry.querySelector(".member-role").value = "";

    teamMembersContainer.appendChild(newTeamMemberEntry);
  }

  // Function to populate the projects dropdown
  function populateProjectsDropdown() {
    const dropdown = document.getElementById("project-select");

    // Clear existing options
    dropdown.innerHTML = "";

    // Create and append new options
    projects.forEach((project) => {
      const option = document.createElement("option");
      option.value = project.id;
      option.text = project.name;
      dropdown.appendChild(option);
    });
  }

  // Function to populate the roles dropdown
  function populateRolesDropdown() {
    const dropdown = document.getElementById("member-role-1");

    // Clear existing options
    dropdown.innerHTML = "";

    // Create and append new options
    roles.forEach((role) => {
      const option = document.createElement("option");
      option.value = role;
      option.text = role;
      dropdown.appendChild(option);
    });
  }

  populateRolesDropdown();
</script>
